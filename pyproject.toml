[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-databricks-genie-connector"
version = "0.1.0"
description = "Configure a managed OAuth connection from Microsoft Foundry to Azure Databricks Genie."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Contributors" }]
dependencies = []

[project.scripts]
foundry-databricks-genie = "foundry_databricks_genie.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
